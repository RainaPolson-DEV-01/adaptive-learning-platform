{% extends "base.html" %}

{% block content %}

<h1>
    📄 Upload Resume
</h1>

<div class="card">

    <div class="card-body">

        {% if error %}

        <div class="alert alert-danger">

            {{ error }}

        </div>

        {% endif %}

        <form
            method="POST"
            enctype="multipart/form-data">

            <div class="mb-3">

                <label class="form-label">

                    Select Resume (PDF)

                </label>

                <input
                    type="file"
                    name="resume"
                    accept=".pdf"
                    class="form-control"
                    required>

            </div>

            <button
                type="submit"
                class="btn btn-primary">

                Generate Profile

            </button>

        </form>

    </div>

</div>

{% endblock %}
