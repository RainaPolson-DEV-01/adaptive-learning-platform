{% extends "base.html" %}

{% block content %}

<h1>
    📄 Upload Resume
</h1>

<div class="card">

    <div class="card-body">

        <form
            method="POST"
            enctype="multipart/form-data">

            <div class="mb-3">

                <label class="form-label">

                    Select Resume (PDF)

                </label>

                <input
                    type="file"
                    name="resume"
                    accept=".pdf"
                    class="form-control">

            </div>

            <button
                class="btn btn-primary"
                type="submit">

                Generate Profile

            </button>

        </form>

    </div>

</div>

{% endblock %}
