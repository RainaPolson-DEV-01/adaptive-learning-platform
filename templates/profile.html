{% extends "base.html" %}

{% block content %}

<div class="card">

    <div class="card-body">

        <h2>
            👤 Learner Profile
        </h2>

        <hr>

        <h3>
            {{ profile.name }}
        </h3>

        <br>

        <h5>
            Career Goals
        </h5>

        <p>
            {{ profile.careerGoals }}
        </p>

        <br>

        <h5>
            Experience Summary
        </h5>

        <p>
            {{ profile.experienceSummary }}
        </p>

        <br>

        <h5>
            Skills
        </h5>

        <div>

            {% for skill in profile.skills %}

            <span class="badge bg-primary">

                {{ skill }}

            </span>

            {% endfor %}

        </div>

    </div>

</div>

{% endblock %}
